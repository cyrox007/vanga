data:
  basics_url: "https://datasets.imdbws.com/title.basics.tsv.gz"
  ratings_url: "https://datasets.imdbws.com/title.ratings.tsv.gz"
  crew_url: "https://datasets.imdbws.com/title.crew.tsv.gz"
  sample_frac: 0.2          # доля выборки (для быстрых экспериментов)
  random_state: 42

features:
  tfidf_max_features: 100
  text_column: "primaryTitle"   # в реальности лучше использовать описание

model:
  n_estimators: 100
  random_state: 42
  n_jobs: -1

train:
  test_size: 0.2
  random_state: 42

paths:
  model_dir: "models"
  model_filename: "random_forest.pkl"
  vectorizer_filename: "tfidf_vectorizer.pkl"
  imputer_filename: "imputer.pkl"